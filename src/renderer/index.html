<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>DeployPilot</title>
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="titlebar">
      <div class="brand-drag"><div class="brand-mark" aria-hidden="true">D</div><span class="brand-name">DeployPilot</span><span class="brand-version" id="app-version">1.0.0</span></div>
      <div class="titlebar-actions">
        <button class="window-btn" id="window-minimize" type="button" aria-label="Minimize window">—</button>
        <button class="window-btn" id="window-maximize" type="button" aria-label="Maximize or restore window">□</button>
        <button class="window-btn close-btn" id="window-close" type="button" aria-label="Close window">×</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="side-section-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="Main navigation">
          <button class="nav-item" data-page="projects"><span class="nav-icon">▦</span><span>Projects</span><span class="nav-count" id="profile-count">0</span></button>
          <button class="nav-item active" data-page="deploy"><span class="nav-icon">↗</span><span>Deploy</span></button>
          <button class="nav-item" data-page="backups"><span class="nav-icon">◷</span><span>Backups</span></button>
          <button class="nav-item" data-page="rules"><span class="nav-icon">☷</span><span>Rules</span></button>
          <button class="nav-item" data-page="history"><span class="nav-icon">◴</span><span>History</span></button>
          <div class="side-divider"></div><div class="side-section-label">SYSTEM</div>
          <button class="nav-item" data-page="logs"><span class="nav-icon">≋</span><span>Logs</span></button>
          <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-card"><div class="sidebar-card-icon">⌁</div><div><strong>Safe by design</strong><span>Back up first. Deploy second.</span></div></div>
          <div class="sidebar-user"><div class="avatar">DP</div><div><strong>Local workspace</strong><span>Credentials stay encrypted</span></div><span class="lock-icon">⌑</span></div>
        </div>
      </aside>
      <main class="main-area">
        <div class="page-top"><div><div class="eyebrow" id="page-eyebrow">DEPLOYMENT WORKSPACE</div><h1 id="page-title">Deploy</h1><p class="page-subtitle" id="page-subtitle">Publish your project to one or more remote targets.</p></div><div class="top-actions" id="page-actions"></div></div>
        <section id="page-content" class="page-content" tabindex="-1"></section>
      </main>
    </div>
    <footer class="statusbar"><div class="status-left"><span class="status-dot"></span><span id="connection-status">Ready</span><span class="status-separator">/</span><span id="current-profile-status">No profile selected</span></div><div class="status-right"><span id="operation-status">Idle</span><span class="status-separator">·</span><span>DeployPilot 1.0.0</span></div></footer>
  </div>
  <dialog id="modal" class="modal"><div class="modal-inner"><div class="modal-head"><div><div class="eyebrow" id="modal-eyebrow">PROJECT</div><h2 id="modal-title">New project</h2></div><button class="icon-btn" id="modal-close" type="button" aria-label="Close dialog">×</button></div><div id="modal-body" class="modal-body"></div><div id="modal-footer" class="modal-footer"></div></div></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
