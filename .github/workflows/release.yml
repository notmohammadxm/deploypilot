name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploypilot-windows-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js 22.12 for Electron packaging
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build and test Windows installer
        run: npm run dist
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item "dist/DeployPilot-Setup-*.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii
      - name: Upload Windows installer artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DeployPilot-Windows-Installer
          path: |
            dist/DeployPilot-Setup-*.exe
            dist/DeployPilot-Setup-*.exe.sha256
          if-no-files-found: warn
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/DeployPilot-Setup-*.exe
            dist/DeployPilot-Setup-*.exe.sha256
          generate_release_notes: true
          overwrite_files: true
        env:
          GH_TOKEN: ${{ github.token }}
