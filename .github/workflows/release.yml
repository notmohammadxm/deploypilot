name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploypilot-windows-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js 22.12 for Electron packaging
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build and test Windows installer
        run: npm run dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.event_name == 'workflow_run' && 'v1.0.0' || github.ref_name }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: dist/DeployPilot-Setup-*.exe
          generate_release_notes: true
          overwrite_files: true
