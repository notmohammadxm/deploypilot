name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        shell: pwsh
        run: |
          $auditOutput = npm audit --json
          $auditExitCode = $LASTEXITCODE
          $report = ($auditOutput -join "`n") | ConvertFrom-Json -Depth 100
          $counts = $report.metadata.vulnerabilities
          Write-Host ("npm audit: {0} critical, {1} high, {2} moderate, {3} low" -f $counts.critical, $counts.high, $counts.moderate, $counts.low)
          $report.vulnerabilities.PSObject.Properties | ForEach-Object {
            $name = $_.Name
            $item = $_.Value
            Write-Host ("{0}: severity={1}; direct={2}; fixAvailable={3}" -f $name, $item.severity, $item.isDirect, ($item.fixAvailable | ConvertTo-Json -Compress))
            foreach ($advisory in $item.via) {
              if ($advisory -isnot [string]) {
                Write-Host ("  - {0} ({1})" -f $advisory.title, $advisory.url)
              }
            }
          }
          if ($counts.critical -gt 0) {
            throw "Critical dependency vulnerabilities were reported."
          }
          if ($auditExitCode -ne 0) {
            Write-Warning "Dependency advisories were reported. Review the package-level details above; this diagnostic step does not auto-apply breaking upgrades."
          }
          $global:LASTEXITCODE = 0
          exit 0
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
